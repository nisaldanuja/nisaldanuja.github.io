<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | Nisal Danuja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* CSS VARIABLES FOR LIGHT/DARK MODE */
        :root {
            --bg-gradient: linear-gradient(135deg, #0b1a2b, #0f2438);
            --text-main: #e6edf3;
            --text-muted: #9fb3c8;
            --nav-bg: #0f2438;
            --card-bg: #162d44;
            --border-color: #1f3a52;
            --accent-color: #4cc9f0;
            --accent-hover: #00b4d8;
            --header-gradient: linear-gradient(90deg, #4cc9f0, #00b4d8);
            --btn-bg: #1e3a5f;
            --btn-hover: #2a4b7c;
            --input-bg: #0b1a2b;
            --footer-text: #8aa4bd;
            --shadow-color: rgba(0, 0, 0, 0.6);
        }

        body.light-mode {
            --bg-gradient: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --nav-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --header-gradient: linear-gradient(90deg, #0284c7, #0369a1);
            --btn-bg: #e2e8f0;
            --btn-hover: #cbd5e1;
            --input-bg: #f8fafc;
            --footer-text: #475569;
            --shadow-color: rgba(148, 163, 184, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid var(--border-color);
            animation: fadeDown 1s ease;
            transition: border-color 0.3s ease;
        }

        h1 {
            font-size: 30px;
            background: var(--header-gradient);
            -webkit-background-clip: text;
            color: transparent;
            transition: background 0.3s ease;
        }

        header p {
            color: var(--text-muted);
            margin-top: 5px;
            transition: color 0.3s ease;
        }

        .header-social-links {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .header-social-links a {
            color: var(--accent-color);
            font-size: 24px;
            text-decoration: none;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .header-social-links a:hover {
            color: var(--text-main);
            transform: translateY(-3px);
        }

        /* NAVIGATION */
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            background: var(--nav-bg);
            padding: 12px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.3s ease;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            position: relative;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        nav a:hover { color: var(--accent-color); }

        nav a::after {
            content: "";
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0%;
            height: 2px;
            background: var(--accent-color);
            transition: .3s;
        }

        nav a:hover::after { width: 100%; }

        /* CALCULATOR STYLES */
        .calc-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 30px var(--shadow-color);
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .calc-display {
            width: 100%;
            height: 60px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: right;
            padding: 10px;
            font-size: 28px;
            color: var(--text-main);
            outline: none;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-btn {
            padding: 15px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            background: var(--btn-bg);
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .calc-btn:hover { background: var(--btn-hover); }
        .calc-btn:active { transform: scale(0.95); }

        .btn-accent {
            background: var(--accent-color);
            color: #0b1a2b;
            font-weight: bold;
        }
        .btn-accent:hover { background: var(--accent-hover); }

        .btn-clear {
            background: #ef4444;
            color: white;
            font-weight: bold;
        }
        .btn-clear:hover { background: #dc2626; }

        /* UPDATED FOOTER STYLES */
        footer {
            width: 100%;
            border-top: 1px solid var(--border-color);
            margin-top: 30px;
            background: transparent;
            transition: border-color 0.3s ease;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            color: var(--footer-text);
            transition: color 0.3s ease;
        }

        .social-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .social-icon {
            font-size: 24px;
            color: var(--text-main);
            transition: transform 0.3s ease, color 0.3s ease;
            text-decoration: none;
        }

        .social-icon:hover {
            color: var(--accent-color);
            transform: translateY(-3px);
        }

        /* THEME TOGGLE BUTTON */
        .theme-toggle-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: #0b1a2b;
            border: none;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease, background-color 0.3s ease, color 0.3s ease;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.1);
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            h1 { font-size: 24px; }
            nav { gap: 10px; padding: 10px; }
            nav a { font-size: 13px; }
            
            /* Target the new inner container for mobile layout */
            .footer-inner {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            header { padding: 30px 10px; }
            h1 { font-size: 20px; }
            nav { gap: 8px; }
            nav a { font-size: 12px; }
        }

        @keyframes fadeDown{
            from{opacity:0;transform:translateY(-20px);} 
            to{opacity:1;transform:translateY(0);} 
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

<header>
    <h1>Nisal Danuja Ranasinghe</h1>
    <p>Student | ICT Enthusiast | Leader</p>
    
    <div class="header-social-links">
        <a href="profile.html" target="_blank" title="LinkedIn Profile"> 
            <i class="fa-brands fa-linkedin"></i>
        </a>
        <a href="contact.html" target="_blank" title="Contact Email"> 
            <i class="fa-solid fa-envelope"></i>
        </a>
    </div>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="contact.html">Contact</a>
    <a href="resume.html">Resume</a>
</nav>

<div class="calc-wrapper">
    <div class="calculator">
        <input type="text" id="display" class="calc-display" disabled value="0">
        
        <div class="calc-buttons">
            <button class="calc-btn btn-clear" onclick="clearDisplay()">C</button>
            <button class="calc-btn btn-accent" onclick="appendValue('(')">(</button>
            <button class="calc-btn btn-accent" onclick="appendValue(')')">)</button>
            <button class="calc-btn btn-accent" onclick="appendValue('/')">÷</button>

            <button class="calc-btn" onclick="appendValue('7')">7</button>
            <button class="calc-btn" onclick="appendValue('8')">8</button>
            <button class="calc-btn" onclick="appendValue('9')">9</button>
            <button class="calc-btn btn-accent" onclick="appendValue('*')">×</button>

            <button class="calc-btn" onclick="appendValue('4')">4</button>
            <button class="calc-btn" onclick="appendValue('5')">5</button>
            <button class="calc-btn" onclick="appendValue('6')">6</button>
            <button class="calc-btn btn-accent" onclick="appendValue('-')">−</button>

            <button class="calc-btn" onclick="appendValue('1')">1</button>
            <button class="calc-btn" onclick="appendValue('2')">2</button>
            <button class="calc-btn" onclick="appendValue('3')">3</button>
            <button class="calc-btn btn-accent" onclick="appendValue('+')">+</button>

            <button class="calc-btn" onclick="appendValue('0')" style="grid-column: span 2;">0</button>
            <button class="calc-btn" onclick="appendValue('.')">.</button>
            <button class="calc-btn btn-accent" onclick="calculate()">=</button>
        </div>
    </div>
</div>

<button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Light and Dark Theme">
    <i class="fa-solid fa-sun"></i>
</button>

<footer>
    <div class="footer-inner">
        <p>© 2026 Nisal Ranasinghe | Portfolio Website</p>

        <div class="social-links">
            <a href="https://www.linkedin.com/in/nisaldanujaranasinghe/" target="_blank" class="social-icon">
                <i class="fab fa-linkedin"></i>
            </a>
            <a href="https://github.com/nisaldanuja" target="_blank" class="social-icon">
                <i class="fab fa-github"></i>
            </a>
            <a href="contact.html" target="_blank" class="social-icon">
                <i class="fa-solid fa-envelope"></i>
            </a>
        </div>
    </div>
</footer>

<script>
    // 1. Calculator Logic
    const display = document.getElementById('display');

    function appendValue(value) {
        if (display.value === '0' || display.value === 'Error') {
            display.value = value;
        } else {
            display.value += value;
        }
    }

    function clearDisplay() {
        display.value = '0';
    }

    function calculate() {
        try {
            display.value = eval(display.value);
        } catch (error) {
            display.value = 'Error';
        }
    }

    // 2. Theme Toggle Logic
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = themeToggleBtn.querySelector('i');

    themeToggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        if (document.body.classList.contains('light-mode')) {
            themeIcon.classList.remove('fa-sun');
            themeIcon.classList.add('fa-moon');
        } else {
            themeIcon.classList.remove('fa-moon');
            themeIcon.classList.add('fa-sun');
        }
    });
</script>

</body>
</html>
